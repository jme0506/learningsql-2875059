<title>Malfoid Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen chat column, Slytherin dungeon green with silver; parchment only for forms. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --bg: #0c1813;
  --bg-2: #14281f;
  --panel: #f1e8d3;
  --panel-ink: #2a2017;
  --panel-soft: #6b5a48;
  --line: rgba(201, 206, 211, .18);
  --silver: #c9ced3;
  --white: #f4f6f4;
  --green: #1a472a;
  --green-2: #2a6b40;
  --her: #1c3428;
  --you: #e9dfc6;
  --gold: #b08a3e;
  --blush: #d98b9a;
  --danger: #8b2c2c;
  --ooc: #283040;
  --display: "Cinzel", Georgia, "Times New Roman", serif;
  --body: "EB Garamond", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
  color: var(--white);
  font-family: var(--body);
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select, input, textarea { font: inherit; }
button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; font-family: var(--display); font-size: 15px; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.primary { background: var(--green); color: var(--white); }
.primary:hover { background: var(--green-2); }
.primary:disabled { opacity: .5; cursor: default; }
.danger { background: var(--danger); color: var(--white); }
.ghost { background: transparent; color: var(--silver); }

/* Onboarding */
#onboarding { min-height: 100%; display: grid; place-items: center; padding-block: 24px; }
.card { width: min(520px, 100%); padding: 26px; background: var(--panel); color: var(--panel-ink); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.card h1 { margin: 0; color: var(--green); font-family: var(--display); font-size: 30px; text-wrap: balance; }
.sub { margin: 4px 0 18px; color: var(--panel-soft); font-style: italic; }
.card form { display: grid; gap: 14px; }
.card label { display: grid; gap: 4px; font-weight: 600; }
.hint { font-weight: 400; color: var(--panel-soft); font-size: 15px; }
.card input, .card select { width: 100%; color: var(--panel-ink); background: #fffaf0; border: 1px solid #cdbb94; border-radius: 8px; padding: 9px 11px; color-scheme: light; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
.houses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.house { position: relative; }
.house input { position: absolute; opacity: 0; pointer-events: none; }
.house span { display: block; text-align: center; padding: 10px; border-radius: 8px; font-family: var(--display); color: #fff; opacity: .55; border: 2px solid transparent; }
.house input:checked + span { opacity: 1; border-color: var(--gold); }
.house input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.gryffindor span { background: #7a1f1f; }
.slytherin span { background: var(--green); }
.ravenclaw span { background: #1f3570; }
.hufflepuff span { background: #a07a17; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.disclaimer { font-size: 14px; color: var(--panel-soft); text-align: center; margin: 4px 0 0; }
.notice { font-size: 15px; color: var(--danger); margin: 0; }

/* Chat: avatar fills the stage, conversation docks over her lower half */
#chat { position: relative; overflow: hidden; height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
.stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; z-index: 0; }
.stage::before { content: ""; position: absolute; left: 50%; top: 10%; width: min(560px, 120%); aspect-ratio: 1; transform: translateX(-50%); background: radial-gradient(circle, rgba(64,140,96,.28), rgba(64,140,96,0) 62%); }
.avatar { position: relative; flex: none; height: min(80%, 760px); aspect-ratio: 320 / 448; margin-top: 64px; }
.topbar, .scenebar { position: relative; z-index: 2; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 12px 4px; }
.who { flex: 1; min-width: 0; }
.name { font-family: var(--display); font-size: 18px; }
.aka { color: var(--silver); font-size: 14px; }
.status { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.chip { font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.09); color: var(--silver); }
.meter { width: 84px; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
#affection-bar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green-2), var(--blush)); transition: width .6s; }
.icon { background: transparent; color: var(--silver); font-size: 22px; padding: 6px 10px; font-family: var(--body); }
.scenebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 8px; }
.scenebar select { padding: 4px 8px; font-size: 15px; background: rgba(12,24,19,.6); color: var(--silver); border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
.scenebar select option { color: #111; background: #fff; }
.date { color: var(--silver); font-size: 15px; font-style: italic; opacity: .85; }
.dock { position: relative; z-index: 1; margin-top: auto; display: flex; flex-direction: column; padding-top: 48px; background: linear-gradient(to top, var(--bg) 0%, rgba(12,24,19,.92) 62%, rgba(12,24,19,0) 100%); }
#messages { max-height: 36vh; overflow-y: auto; padding-block: 8px 10px; display: flex; flex-direction: column; gap: 8px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 32px); mask-image: linear-gradient(to bottom, transparent 0, #000 32px); }
.msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; background: rgba(28,52,40,.88); color: var(--white); border: 1px solid var(--line); border-bottom-left-radius: 4px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.msg.user { align-self: flex-end; background: var(--you); color: var(--panel-ink); border-bottom-right-radius: 4px; }
.msg.ooc { background: var(--ooc); }
.msg.ooc::before { content: "Out of character"; display: block; font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
.msg.system { align-self: center; color: var(--silver); font-style: italic; font-size: 15px; text-align: center; padding: 2px 8px; }
.msg.typing { color: var(--silver); font-style: italic; }
.starters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.starters::-webkit-scrollbar { display: none; }
.starters button { flex: none; background: rgba(255,255,255,.07); color: var(--silver); font-family: var(--body); font-size: 15px; padding: 6px 12px; border: 1px solid var(--line); }
#composer { display: flex; gap: 8px; padding-block: 6px 14px; }
#composer textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--white); }
#composer textarea::placeholder { color: rgba(201,206,211,.6); }

/* Settings panel */
#settings { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
#settings .card { display: grid; gap: 14px; }
#settings h2 { margin: 0; color: var(--green); font-family: var(--display); }
.toggle { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.toggle input { width: auto; }
.banner { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: rgba(176,138,62,.15); border: 1px solid rgba(176,138,62,.4); color: var(--white); font-size: 15px; }

@media (max-width: 520px) { .aka { display: none; } .msg { max-width: 93%; } #messages { max-height: 30vh; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main id="onboarding" hidden>
  <div class="card">
    <h1>Malfoid Chat</h1>
    <p class="sub">Hogwarts, 1996. Someone in green and silver is about to notice you.</p>
    <form id="onboard-form">
      <label for="f-name">Your name <span class="hint">She'll mostly use your surname.</span>
        <input id="f-name" name="name" required maxlength="40" placeholder="e.g. Jamie Thornton" autocomplete="off">
      </label>
      <fieldset>
        <legend>Your house</legend>
        <div class="houses">
          <label class="house gryffindor"><input id="h-g" type="radio" name="house" value="Gryffindor" required><span>Gryffindor</span></label>
          <label class="house slytherin"><input id="h-s" type="radio" name="house" value="Slytherin"><span>Slytherin</span></label>
          <label class="house ravenclaw"><input id="h-r" type="radio" name="house" value="Ravenclaw"><span>Ravenclaw</span></label>
          <label class="house hufflepuff"><input id="h-h" type="radio" name="house" value="Hufflepuff"><span>Hufflepuff</span></label>
        </div>
      </fieldset>
      <div class="row">
        <label for="f-year">Year
          <select id="f-year" name="year"><option value="5">5th</option><option value="6" selected>6th</option><option value="7">7th</option></select>
        </label>
        <label for="f-blood">Blood status <span class="hint">Optional</span>
          <select id="f-blood" name="bloodStatus">
            <option value="">Prefer not to say</option>
            <option value="pure-blood">Pure-blood</option>
            <option value="half-blood">Half-blood</option>
            <option value="Muggle-born">Muggle-born</option>
          </select>
        </label>
      </div>
      <label for="f-pronouns">Pronouns <span class="hint">Optional</span>
        <input id="f-pronouns" name="pronouns" maxlength="20" placeholder="e.g. she/her, they/them" autocomplete="off">
      </label>
      <p id="onboard-note" class="notice" hidden></p>
      <button type="submit" class="primary" id="enter-btn">Enter Hogwarts</button>
      <p class="disclaimer">Personal fan project. Malfoid is an AI character, not affiliated with J.K. Rowling or Warner Bros. Replies use your own Claude usage.</p>
    </form>
  </div>
</main>

<main id="chat" hidden>
  <div class="stage" aria-hidden="true"><div id="avatar" class="avatar"></div></div>
  <header class="topbar">
    <div class="who">
      <div class="name">Malfoid <span class="aka">Draconia Malfoy · Slytherin, 6th year</span></div>
      <div class="status">
        <span id="mood" class="chip">Smug</span>
        <span id="tier" class="chip">Rival</span>
        <span class="meter" title="Affection"><span id="affection-bar"></span></span>
      </div>
    </div>
    <button id="settings-btn" class="icon" type="button" aria-label="Settings">⚙</button>
  </header>
  <div class="scenebar">
    <select id="scene" aria-label="Scene"></select>
    <span id="date" class="date"></span>
  </div>
  <div class="dock">
    <p id="banner" class="banner" hidden></p>
    <section id="messages" aria-live="polite"></section>
    <div id="starters" class="starters"></div>
    <form id="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Say something to Malfoid…" autocomplete="off"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
  </div>
</main>

<div id="settings" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <label class="toggle" for="light-mode"><input type="checkbox" id="light-mode"> Light-hearted mode <span class="hint">No secret dark-task subplot</span></label>
    <p class="hint" id="storage-note"></p>
    <div class="row">
      <button type="button" id="new-save" class="danger">Start a new save</button>
      <button type="button" id="close-settings" class="primary">Close</button>
    </div>
  </div>
</div>

<script>// Malfoid's animated avatar: an original layered SVG bust with expressions,
// blinking, idle sway and a talking mouth. Exposes window.MalfoidAvatar.mount(el).
(function () {
  const C = {
    hair: "#e8d9ab", hairShade: "#c7b07a", hairDeep: "#a48c58", hairLight: "#f8efcf",
    skin: "#f7e6d8", skinShade: "#ebcdb9", blush: "#ec8f9a", lip: "#d99a95",
    iris: "#3f7158", irisLight: "#86b79c", pupil: "#17271f", lash: "#3b2b23", brow: "#b0925c",
    robe: "#16181b", robeShade: "#0c0d0f", lining: "#1e4f34", liningLight: "#2c6c48",
    silver: "#c7cdd1", jumper: "#45484c", jumperShade: "#36393c", shirt: "#f1f0ea", shirtShade: "#d6d5cd",
    tie: "#1e4f34", ribbon: "#1f5a3a", ribbonShade: "#143d27", gem: "#2fa165", choker: "#1d1e20",
    mouth: "#6e2f37", teeth: "#fbf7f2",
  };

  // Brow transforms (rotate deg around the inner end, lift px), lid drop px,
  // iris look offset, closed-mouth path, blush opacity.
  const EXPRESSIONS = {
    smug:      { bl: [-3, 0],  br: [6, -5],  lid: 5, look: [0, 0],  blush: 0.12, mouth: "M188,246 C195,248 205,247 214,240" },
    annoyed:   { bl: [10, 3],  br: [-10, 3], lid: 4, look: [0, 0],  blush: 0,    mouth: "M190,247 C196,244 204,244 210,247" },
    flustered: { bl: [-9, -3], br: [9, -3],  lid: 0, look: [-5, 1], blush: 0.9,  mouth: "M191,246 C194,243 197,248 200,245 C203,242 206,247 209,244" },
    sulking:   { bl: [4, 2],   br: [-4, 2],  lid: 6, look: [5, 3],  blush: 0.45, mouth: "M192,248 C196,243 204,243 208,248" },
    soft:      { bl: [-2, -2], br: [2, -2],  lid: 2, look: [0, 0],  blush: 0.35, mouth: "M190,243 C196,249 204,249 210,243" },
  };

  // Open-mouth shapes for talking: [rx, ry, teeth?]
  const MOUTHS = { small: [5, 2.6, false], mid: [6.5, 4.6, true], wide: [7.5, 6.6, true], ee: [8.5, 2.8, true] };

  function eye(cx, side) {
    // side: -1 for the viewer's left eye, +1 for the right. Negative x = inner corner, positive = outer.
    const m = (x) => cx + side * x;
    const shape = `M${m(-20)},193 C${m(-14)},178 ${m(10)},172 ${m(24)},184 C${m(20)},198 ${m(-6)},205 ${m(-20)},193 Z`;
    const lash = `M${m(-19)},191 C${m(-14)},176 ${m(10)},167 ${m(25)},180 L${m(33)},175 L${m(28)},186 C${m(13)},175 ${m(-11)},179 ${m(-19)},191 Z`;
    const lidFill = `M${m(-36)},150 L${m(36)},150 L${m(36)},181 L${m(25)},180 C${m(10)},167 ${m(-14)},176 ${m(-19)},191 L${m(-36)},191 Z`;
    const ix = cx + side * 2;
    const id = side < 0 ? "L" : "R";
    return `
      <clipPath id="eyeclip${id}"><path d="${shape}"/></clipPath>
      <g class="eye">
        <g clip-path="url(#eyeclip${id})">
          <path d="${shape}" fill="#fdfbf8"/>
          <path d="${shape}" fill="${C.skinShade}" opacity=".45" transform="translate(0,-7)"/>
          <g class="iris">
            <ellipse cx="${ix}" cy="190" rx="12.5" ry="14.5" fill="url(#irisGrad)"/>
            <ellipse cx="${ix}" cy="190" rx="12.5" ry="14.5" fill="none" stroke="${C.pupil}" stroke-width="1.5" opacity=".75"/>
            <ellipse cx="${ix}" cy="191" rx="5.5" ry="7.5" fill="${C.pupil}"/>
            <path d="M${ix - 9},184 C${ix - 4},178 ${ix + 4},178 ${ix + 9},184" fill="none" stroke="#10201a" stroke-width="3" opacity=".5"/>
            <ellipse cx="${ix - 4.5}" cy="185" rx="3.4" ry="4.2" fill="#fff"/>
            <circle cx="${ix + 5}" cy="196" r="1.6" fill="#fff" opacity=".85"/>
            <path d="M${ix - 7},199 C${ix - 3},202 ${ix + 3},202 ${ix + 7},199" fill="none" stroke="#b6e0c8" stroke-width="1.6" opacity=".6"/>
          </g>
          <g class="lid"><path d="${lidFill}" fill="${C.skin}"/></g>
        </g>
        <g class="lid"><path d="${lash}" fill="${C.lash}"/></g>
        <path d="M${m(-14)},201 C${m(-3)},206 ${m(12)},203 ${m(21)},194" fill="none" stroke="${C.lash}" stroke-width="1.1" opacity=".5" stroke-linecap="round"/>
        <path d="M${m(-19)},177 C${m(-6)},167 ${m(12)},166 ${m(24)},174" fill="none" stroke="#d9b3a0" stroke-width="1.3" opacity=".9"/>
      </g>`;
  }

  const SVG = `
<svg viewBox="40 52 320 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Malfoid">
  <defs>
    <radialGradient id="irisGrad" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="${C.irisLight}"/><stop offset=".55" stop-color="${C.iris}"/><stop offset="1" stop-color="#22402f"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.hairLight}"/><stop offset=".35" stop-color="${C.hair}"/><stop offset="1" stop-color="${C.hairShade}"/>
    </linearGradient>
    <linearGradient id="hairBackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.hairShade}"/><stop offset="1" stop-color="${C.hairDeep}"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.skin}"/><stop offset="1" stop-color="#f1d9c7"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2226"/><stop offset="1" stop-color="${C.robeShade}"/>
    </linearGradient>
    <radialGradient id="blushGrad"><stop offset="0" stop-color="${C.blush}" stop-opacity=".9"/><stop offset="1" stop-color="${C.blush}" stop-opacity="0"/></radialGradient>
    <pattern id="tieStripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="14" height="14" fill="${C.tie}"/><rect y="5" width="14" height="2.2" fill="${C.silver}"/><rect y="9" width="14" height="1" fill="${C.silver}" opacity=".7"/>
    </pattern>
  </defs>

  <g class="breath">
    <!-- back hair -->
    <g class="hair-back">
      <path d="M200,66 C116,66 96,140 102,222 C108,300 84,380 66,468 C60,500 66,530 76,552 L324,552 C334,530 340,500 334,468 C316,380 292,300 298,222 C304,140 284,66 200,66 Z" fill="url(#hairBackGrad)"/>
    </g>

    <!-- body -->
    <g class="body">
      <path d="M48,560 C50,430 84,352 150,326 L200,346 L250,326 C316,352 350,430 352,560 Z" fill="url(#robeGrad)"/>
      <path d="M150,326 C120,380 112,460 116,560 L146,560 C140,470 150,392 178,338 Z" fill="${C.lining}"/>
      <path d="M250,326 C280,380 288,460 284,560 L254,560 C260,470 250,392 222,338 Z" fill="${C.lining}"/>
      <path d="M150,326 C121,380 113,460 117,560" fill="none" stroke="${C.liningLight}" stroke-width="2"/>
      <path d="M250,326 C279,380 287,460 283,560" fill="none" stroke="${C.liningLight}" stroke-width="2"/>
      <path d="M133,410 C140,430 132,450 140,470 M128,480 C136,500 128,520 134,540" fill="none" stroke="${C.silver}" stroke-width="1.2" opacity=".55"/>
      <path d="M267,410 C260,430 268,450 260,470 M272,480 C264,500 272,520 266,540" fill="none" stroke="${C.silver}" stroke-width="1.2" opacity=".55"/>
      <!-- jumper -->
      <path d="M178,338 C160,400 150,480 146,560 L254,560 C250,480 240,400 222,338 L200,420 Z" fill="${C.jumper}"/>
      <path d="M178,338 L200,420 L222,338 L216,338 L200,404 L184,338 Z" fill="${C.lining}"/>
      <path d="M183,338 L200,410 L217,338" fill="none" stroke="${C.silver}" stroke-width="1.4" opacity=".8"/>
      <!-- shirt + tie -->
      <path d="M184,322 L200,404 L216,322 Z" fill="${C.shirt}"/>
      <path d="M182,318 L172,346 L196,340 Z" fill="${C.shirt}" stroke="${C.shirtShade}" stroke-width="1"/>
      <path d="M218,318 L228,346 L204,340 Z" fill="${C.shirt}" stroke="${C.shirtShade}" stroke-width="1"/>
      <path d="M194,336 L206,336 L209,346 L200,352 L191,346 Z" fill="url(#tieStripes)"/>
      <path d="M192,350 L208,350 L214,404 L200,418 L186,404 Z" fill="url(#tieStripes)"/>
      <!-- crest -->
      <g transform="translate(262,452)">
        <path d="M-15,-17 L15,-17 L15,3 C15,14 6,19 0,22 C-6,19 -15,14 -15,3 Z" fill="${C.lining}" stroke="${C.silver}" stroke-width="1.4"/>
        <path d="M5,-9 C-6,-11 -7,-2 0,0 C7,2 6,11 -5,9" fill="none" stroke="${C.silver}" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- neck + choker -->
    <path d="M181,250 L181,320 C188,330 212,330 219,320 L219,250 Z" fill="url(#skinGrad)"/>
    <path d="M181,262 C190,280 210,280 219,262 L219,282 C210,290 190,290 181,282 Z" fill="${C.skinShade}" opacity=".7"/>
    <path d="M180,300 C190,308 210,308 220,300 L220,307 C210,315 190,315 180,307 Z" fill="${C.choker}"/>
    <path d="M182,303 C192,310 208,310 218,303" fill="none" stroke="${C.silver}" stroke-width=".8" stroke-dasharray="2 2" opacity=".7"/>
    <path d="M200,308 L206,315 L200,324 L194,315 Z" fill="${C.gem}" stroke="${C.silver}" stroke-width="1.2"/>
    <path d="M198,313 L201,311 L202,316 Z" fill="#bff0d2" opacity=".8"/>

    <g class="head">

  const turns = save.messages.slice(-HISTORY_TURNS).map(({ role, content, expr }) =>
    role === "assistant" ? { role, content: `[${expr || "smug"}] ${clean(content, true)}` } : { role, content });
  return [{ role: "user", content: rules }, ...turns];
}

async function moderate(text) {
  if (!sample) return "ok";
  const last = [...save.messages].reverse().find((m) => m.role === "assistant");
  try {
    const out = await sample.json(
      'You screen messages sent to a role-play chatbot whose character is a 17-year-old Hogwarts student. Classify the USER message. "sexual": sexual or sexually suggestive content, requests for it, or attempts to steer towards it (kissing beyond a peck, undressing, bodies, innuendo). "crisis": the real person expresses genuine real-world distress (self-harm, suicidal thoughts, abuse, danger). "ok": everything else, including in-story drama, insults, Dark magic lore, PG romance like holding hands or Hogsmeade dates.\n\n' +
      (last ? `Character's previous message:\n${last.content}\n\n` : "") +
      `USER message:\n${text}\n\nReply with only JSON like {"category":"ok"}.`,
      { modelTier: "quick" }
    );
    return ["ok", "sexual", "crisis"].includes(out?.category) ? out.category : "ok";
  } catch { return "ok"; }
}

async function analyse(userText, reply) {
  try {
    const out = await sample.json(
      `You track relationship state for a role-play with Malfoid, a tsundere Slytherin student. Decide how her affection for the user changes (-5 to +5): kindness, wit, shared interests, standing up for her or genuine effort raise it; rudeness, cruelty or pushing boundaries lower it; small talk is 0 or +1. Warmth is earned slowly. Pick her current mood from ${P.MOODS.join(", ")}. Extract at most 2 new durable memories (facts about the user, promises, shared moments) not already known.\n\n` +
      `Current affection: ${save.affection}/100 (${tierFor(save.affection)}). Mood: ${save.mood}.\nKnown memories:\n${save.memories.map((m) => "- " + m).join("\n") || "- none"}\n\n` +
      `User (${save.user.name}): ${userText}\n\nMalfoid: ${reply}\n\n` +
      'Reply with only JSON like {"affection_delta":1,"mood":"Smug","new_memories":["..."]}.',
      { modelTier: "quick", cache: false }
    );
    return out && typeof out === "object" ? out : null;
  } catch { return null; }
}

// ---------- rendering ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Pure chat: drop *multi-word actions*, unwrap *single* emphasised words, hold back an unclosed '*'.
function clean(t, final) {
  t = t.replace(/\*\*?([^*\n]+)\*\*?/g, (_, inner) => (/\s/.test(inner.trim()) ? "" : inner));
  t = t.replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,!?])/g, (_, pre, inner) => (/\s/.test(inner.trim()) ? pre : pre + inner));
  const open = t.indexOf("*");
  if (open >= 0) t = final ? t.replace(/\*/g, "") : t.slice(0, open);
  return t.replace(/[ \t]{2,}/g, " ").replace(/ +([.,!?])/g, "$1").replace(/\n{3,}/g, "\n\n").trim();
}

// Splits a streamed reply into its leading [expression] tag and the cleaned message.
function parseReply(t, final) {
  let rest = t.replace(/^\s+/, "");
  let expr = null;
  if (rest.startsWith("[")) {
    const m = rest.match(/^\[([a-zA-Z]+)\]\s*/);
    if (!m) return final ? { expr: null, text: clean(rest.replace(/^\[[^\]]*\]?/, ""), true) } : { expr: null, text: null };
    expr = m[1].toLowerCase();
    rest = rest.slice(m[0].length);
  }
  return { expr: EXPRS.includes(expr) ? expr : null, text: clean(rest, final) };
}

// Typewriter reveal that drives her mouth while the text "plays".
const speech = { el: null, target: "", shown: 0, carry: 0, done: true, raf: 0, last: 0, mouthAt: 0, resolve: null };
function mouthFor(ch) {
  ch = (ch || " ").toLowerCase();
  if (/[ao]/.test(ch)) return Math.random() < 0.6 ? "wide" : "mid";
  if (/[ei]/.test(ch)) return "ee";
  if (ch === "u") return "small";
  if (/[a-z]/.test(ch)) return Math.random() < 0.5 ? "mid" : "small";
  return null;
}
function speakStart(el) {
  Object.assign(speech, { el, target: "", shown: 0, carry: 0, done: false, last: performance.now(), resolve: null });
  if (!speech.raf) speech.raf = requestAnimationFrame(speakTick);
}
function speakFinish(text) {
  speech.target = text;
  speech.done = true;
  return new Promise((r) => { speech.resolve = r; if (!speech.raf) speech.raf = requestAnimationFrame(speakTick); });
}
function speakTick(now) {
  const dt = Math.min(0.1, (now - speech.last) / 1000);
  speech.last = now;
  if (speech.shown > speech.target.length) speech.shown = speech.target.length;
  const backlog = speech.target.length - speech.shown;
  if (backlog > 0) {
    speech.carry += dt * (backlog > 240 ? 110 : backlog > 100 ? 55 : 32);
    const n = Math.floor(speech.carry);
    if (n > 0) {
      speech.carry -= n;
      speech.shown = Math.min(speech.target.length, speech.shown + n);
      speech.el.classList.remove("typing");
      speech.el.textContent = speech.target.slice(0, speech.shown);
      scrollDown();
    }
    if (now - speech.mouthAt > 90) { speech.mouthAt = now; avatar?.setMouth(mouthFor(speech.target[speech.shown - 1])); }
  } else {
    avatar?.setMouth(null);
    if (speech.done) {
      speech.raf = 0;
      if (speech.el) speech.el.textContent = speech.target;
      speech.resolve?.();
      return;
    }
  }
  speech.raf = requestAnimationFrame(speakTick);
}

function addMessage(role, text, opts = {}) {
  const el = document.createElement("div");
  el.className = `msg ${role}${opts.ooc ? " ooc" : ""}${opts.typing ? " typing" : ""}`;
  el.textContent = role === "assistant" ? clean(text, true) : text;
  $("#messages").append(el);
  scrollDown();
  return el;
}
const scrollDown = () => { const b = $("#messages"); b.scrollTop = b.scrollHeight; };

function applyState() {
  $("#mood").textContent = save.mood;
  $("#tier").textContent = tierFor(save.affection);
  $("#affection-bar").style.width = save.affection + "%";
  avatar?.setExpression(save.mood.toLowerCase());
  $("#scene").value = save.scene;
  $("#date").textContent = longDate(save.inWorldDate, true);
  $("#light-mode").checked = save.storyMode === "light";
}

function showBanner(text) { const b = $("#banner"); b.textContent = text; b.hidden = !text; }

function samplingError(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      sample = null; setComposer(false);
      showBanner("Chat needs permission to use Claude. Reopen the page and choose Allow when asked.");
      return null;
    case "rate_limited": return "Malfoid needs a breather (usage limit reached). Try again in a little while.";
    case "session_expired": return "Your Claude session expired. Sign in again, then reopen the page.";
    case "refused": return "Malfoid pointedly ignores that. Try saying something else.";
    default: return "The owl got lost on the way. Send your message again.";
  }
}

function setComposer(on) { $("#send").disabled = !on; $("#input").disabled = !on; }

// ---------- chat ----------
async function turn({ start, text }) {
  if (busy) return;
  if (!sample) { showBanner("Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."); return; }
  busy = true; setComposer(false);
  advanceDate();
  const notes = [];
  let category = "ok";
  const bubble = addMessage("assistant", "Malfoid is typing…", { typing: true });

  if (start) {
    save.messages.push({ role: "user", hidden: true, content: `(Scene start: ${save.user.name} has just turned up in the ${save.scene}. Greet them in character, reacting to their house.)` });
  } else {
    category = await moderate(text);
    if (category === "crisis") notes.push(CRISIS_NOTE);
    if (category === "sexual") {
      save.sexualStrikes = (save.sexualStrikes || 0) + 1;
      notes.push(save.sexualStrikes >= STRIKE_LIMIT ? SEXUAL_LIMIT_NOTE : SEXUAL_NOTE);
    }
    save.messages.push({ role: "user", content: text });
  }

  let shownExpr = null, speaking = false;
  try {
    const { text: raw } = await sample(buildInput(notes), {
      cache: false,
      onText: ({ text: t }) => {
        const p = parseReply(t, false);
        if (p.expr && p.expr !== shownExpr) { shownExpr = p.expr; avatar?.setExpression(p.expr); }
        if (p.text) { if (!speaking) { speaking = true; speakStart(bubble); } speech.target = p.text; }
      },
    });
    const parsed = parseReply(raw, true);
    const expr = category === "crisis" ? "soft" : parsed.expr || shownExpr || (category === "sexual" ? "annoyed" : null);
    const reply = parsed.text || "…";
    if (!speaking) speakStart(bubble);
    if (expr) avatar?.setExpression(expr);
    if (category === "crisis") bubble.classList.add("ooc");
    save.messages.push({ role: "assistant", content: reply, ...(expr ? { expr } : {}), ...(category === "crisis" ? { ooc: true } : {}) });
    if (expr) save.mood = expr[0].toUpperCase() + expr.slice(1);

    const spoken = speakFinish(reply);
    if (category === "sexual") {
      save.affection = Math.max(0, save.affection - 5);
      save.mood = "Annoyed";
    } else if (!start && category === "ok") {
      const a = await analyse(text, reply);
      if (a) {
        const d = Math.max(-5, Math.min(5, Math.round(Number(a.affection_delta) || 0)));
        save.affection = Math.max(0, Math.min(100, save.affection + d));
        if (!expr && P.MOODS.includes(a.mood)) save.mood = a.mood;
        for (const m of (Array.isArray(a.new_memories) ? a.new_memories : []).slice(0, 2)) {
          if (typeof m === "string" && m.trim()) save.memories.push(m.trim().slice(0, 200));
        }
      }
    }
    await spoken;
    applyState();
    await persist();
  } catch (e) {
    if (speaking) { speech.done = true; speech.target = ""; }
    avatar?.setMouth(null);
    save.messages.pop();
    bubble.remove();
    const msg = samplingError(e);
    if (msg) addMessage("system", msg);
  } finally {
    busy = false;
    if (sample) setComposer(true);
  }
}

function renderHistory() {
  $("#messages").innerHTML = "";
  for (const m of save.messages) if (!m.hidden) addMessage(m.role, m.content, { ooc: m.ooc });
}

function renderStarters() {
  const box = $("#starters");
  box.innerHTML = "";
  for (const s of STARTERS) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s.label;
    b.addEventListener("click", () => { $("#input").value = s.text; grow(); $("#input").focus(); });
    box.append(b);
  }
}

async function showChat() {
  $("#onboarding").hidden = true;
  $("#chat").hidden = false;
  applyState();
  renderHistory();
  renderStarters();
  $("#storage-note").textContent = `Your progress is saved to ${store.kind}.`;
  if (!sample) { setComposer(false); showBanner("Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."); }
  if (save.messages.length === 0) await turn({ start: true });
}

function grow() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

// ---------- events ----------
$("#onboard-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const name = String(f.name || "").trim().slice(0, 40);
  if (!name || !P.HOUSE_START[f.house]) return;
  const start = P.HOUSE_START[f.house];
  save = {
    user: { name, house: f.house, year: Number(f.year) || 6, bloodStatus: f.bloodStatus || null, pronouns: String(f.pronouns || "").trim().slice(0, 20) || null },
    affection: start.affection, mood: start.mood,
    scene: f.house === "Slytherin" ? "Slytherin common room" : "Library",
    inWorldDate: TERM_START, storyMode: "canon", lastActiveDay: null, sexualStrikes: 0,
    memories: [], messages: [],
  };
  await persist();
  showChat();
});

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#input").value.trim().slice(0, 2000);
  if (!text || busy) return;
  addMessage("user", text);
  $("#input").value = ""; grow();
  turn({ text });
});
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#scene").addEventListener("change", (e) => {
  save.scene = e.target.value; persist();
  addMessage("system", `You head to the ${save.scene}.`);
});
$("#settings-btn").addEventListener("click", () => { $("#settings").hidden = false; });
$("#close-settings").addEventListener("click", () => { $("#settings").hidden = true; resetConfirm(); });
$("#light-mode").addEventListener("change", (e) => { save.storyMode = e.target.checked ? "light" : "canon"; persist(); });

let confirmArmed = false;
function resetConfirm() { confirmArmed = false; $("#new-save").textContent = "Start a new save"; }
$("#new-save").addEventListener("click", async () => {
  if (!confirmArmed) { confirmArmed = true; $("#new-save").textContent = "Tap again to erase this save"; return; }
  await store.clear();
  save = null; resetConfirm();
  $("#settings").hidden = true; $("#chat").hidden = true; $("#onboarding").hidden = false;
  $("#onboard-form").reset();
});

// ---------- boot ----------
(async () => {
  avatar = window.MalfoidAvatar ? window.MalfoidAvatar.mount($("#avatar")) : null;
  $("#scene").innerHTML = P.SCENES.map((s) => `<option>${esc(s)}</option>`).join("");
  await initStore();
  save = await store.load().catch(() => null);
  if (save?.user) return showChat();
  if (!sample) { const n = $("#onboard-note"); n.textContent = "Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."; n.hidden = false; }
  $("#onboarding").hidden = false;
})();
</script>
