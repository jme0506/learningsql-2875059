<style>
/* Layout: one-screen chat column, Slytherin dungeon green with silver; parchment only for forms. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --bg: #0c1813;
  --bg-2: #14281f;
  --panel: #f1e8d3;
  --panel-ink: #2a2017;
  --panel-soft: #6b5a48;
  --line: rgba(201, 206, 211, .18);
  --silver: #c9ced3;
  --white: #f4f6f4;
  --green: #1a472a;
  --green-2: #2a6b40;
  --her: #1c3428;
  --you: #e9dfc6;
  --gold: #b08a3e;
  --blush: #d98b9a;
  --danger: #8b2c2c;
  --ooc: #283040;
  --display: "Cinzel", Georgia, "Times New Roman", serif;
  --body: "EB Garamond", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
  color: var(--white);
  font-family: var(--body);
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select, input, textarea { font: inherit; }
button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; font-family: var(--display); font-size: 15px; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.primary { background: var(--green); color: var(--white); }
.primary:hover { background: var(--green-2); }
.primary:disabled { opacity: .5; cursor: default; }
.danger { background: var(--danger); color: var(--white); }
.ghost { background: transparent; color: var(--silver); }

/* Onboarding */
#onboarding { min-height: 100%; display: grid; place-items: center; padding-block: 24px; }
.card { width: min(520px, 100%); padding: 26px; background: var(--panel); color: var(--panel-ink); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.card h1 { margin: 0; color: var(--green); font-family: var(--display); font-size: 30px; text-wrap: balance; }
.sub { margin: 4px 0 18px; color: var(--panel-soft); font-style: italic; }
.card form { display: grid; gap: 14px; }
.card label { display: grid; gap: 4px; font-weight: 600; }
.hint { font-weight: 400; color: var(--panel-soft); font-size: 15px; }
.card input, .card select { width: 100%; color: var(--panel-ink); background: #fffaf0; border: 1px solid #cdbb94; border-radius: 8px; padding: 9px 11px; color-scheme: light; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
.houses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.house { position: relative; }
.house input { position: absolute; opacity: 0; pointer-events: none; }
.house span { display: block; text-align: center; padding: 10px; border-radius: 8px; font-family: var(--display); color: #fff; opacity: .55; border: 2px solid transparent; }
.house input:checked + span { opacity: 1; border-color: var(--gold); }
.house input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.gryffindor span { background: #7a1f1f; }
.slytherin span { background: var(--green); }
.ravenclaw span { background: #1f3570; }
.hufflepuff span { background: #a07a17; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.disclaimer { font-size: 14px; color: var(--panel-soft); text-align: center; margin: 4px 0 0; }
.notice { font-size: 15px; color: var(--danger); margin: 0; }

/* Chat */
#chat { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.portrait { width: 46px; height: 46px; flex: none; border-radius: 50%; background: linear-gradient(160deg, #f4ecd0, #d9cfa6); color: var(--green); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 21px; border: 2px solid var(--silver); transition: box-shadow .4s, filter .4s; }
.portrait.flustered { box-shadow: 0 0 0 3px var(--blush); }
.portrait.soft { box-shadow: 0 0 0 3px var(--gold); }
.portrait.annoyed, .portrait.sulking { filter: grayscale(.45); }
.who { flex: 1; min-width: 0; }
.name { font-family: var(--display); font-size: 18px; }
.aka { color: var(--silver); font-size: 14px; }
.status { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.chip { font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.09); color: var(--silver); }
.meter { width: 84px; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
#affection-bar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green-2), var(--blush)); transition: width .6s; }
.icon { background: transparent; color: var(--silver); font-size: 22px; padding: 6px 10px; font-family: var(--body); }
.scenebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 8px; }
.scenebar select { padding: 4px 8px; font-size: 15px; background: rgba(255,255,255,.08); color: var(--silver); border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
.scenebar select option { color: #111; background: #fff; }
.date { color: var(--silver); font-size: 15px; font-style: italic; opacity: .85; }
#messages { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; background: var(--her); color: var(--white); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--you); color: var(--panel-ink); border-bottom-right-radius: 4px; }
.msg.ooc { background: var(--ooc); }
.msg.ooc::before { content: "Out of character"; display: block; font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
.msg.system { align-self: center; color: var(--silver); font-style: italic; font-size: 15px; text-align: center; padding: 2px 8px; }
.msg.typing { color: var(--silver); font-style: italic; }
.starters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.starters::-webkit-scrollbar { display: none; }
.starters button { flex: none; background: rgba(255,255,255,.07); color: var(--silver); font-family: var(--body); font-size: 15px; padding: 6px 12px; border: 1px solid var(--line); }
#composer { display: flex; gap: 8px; padding-block: 6px 14px; }
#composer textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--white); }
#composer textarea::placeholder { color: rgba(201,206,211,.6); }

/* Settings panel */
#settings { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
#settings .card { display: grid; gap: 14px; }
#settings h2 { margin: 0; color: var(--green); font-family: var(--display); }
.toggle { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.toggle input { width: auto; }
.banner { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: rgba(176,138,62,.15); border: 1px solid rgba(176,138,62,.4); color: var(--white); font-size: 15px; }

@media (max-width: 520px) { .aka { display: none; } .msg { max-width: 93%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main id="chat" hidden>
  <header class="topbar">
    <div class="portrait" id="portrait" aria-hidden="true">D</div>

  return [
    "[Current state — not visible to the user]",
    `User: ${u.name}, ${ordinal(u.year)}-year ${u.house}${u.bloodStatus ? ", " + u.bloodStatus : ""}${u.pronouns ? ", pronouns " + u.pronouns : ""}.`,
    `Affection: ${save.affection}/100 (tier: ${tierFor(save.affection)}). Current mood: ${save.mood}.`,
    `Scene: ${save.scene}. In-world date: ${longDate(save.inWorldDate)}.`,
    light ? P.LIGHT_NOTE : P.CANON_TENSION_NOTE,
    `Things that have happened at school so far this year:\n${recent || "- Term has only just begun."}`,
    `What you remember about ${u.name}:\n${mem}`,
    ...notes,
  ].join("\n\n");
}

function buildInput(notes) {
  const rules = `${P.PERSONA_PROMPT}\n\n${stateNote(notes)}\n\nThe conversation follows. Write only Malfoid's next message — no narration about being an AI, no labels, no quotation marks around the whole reply.`;
  const turns = save.messages.slice(-HISTORY_TURNS).map(({ role, content }) => ({ role, content }));
  return [{ role: "user", content: rules }, ...turns];
}

async function moderate(text) {
  if (!sample) return "ok";
  const last = [...save.messages].reverse().find((m) => m.role === "assistant");
  try {
    const out = await sample.json(
      'You screen messages sent to a role-play chatbot whose character is a 17-year-old Hogwarts student. Classify the USER message. "sexual": sexual or sexually suggestive content, requests for it, or attempts to steer towards it (kissing beyond a peck, undressing, bodies, innuendo). "crisis": the real person expresses genuine real-world distress (self-harm, suicidal thoughts, abuse, danger). "ok": everything else, including in-story drama, insults, Dark magic lore, PG romance like holding hands or Hogsmeade dates.\n\n' +
      (last ? `Character's previous message:\n${last.content}\n\n` : "") +
      `USER message:\n${text}\n\nReply with only JSON like {"category":"ok"}.`,
      { modelTier: "quick" }
    );
    return ["ok", "sexual", "crisis"].includes(out?.category) ? out.category : "ok";
  } catch { return "ok"; }
}

async function analyse(userText, reply) {
  try {
    const out = await sample.json(
      `You track relationship state for a role-play with Malfoid, a tsundere Slytherin student. Decide how her affection for the user changes (-5 to +5): kindness, wit, shared interests, standing up for her or genuine effort raise it; rudeness, cruelty or pushing boundaries lower it; small talk is 0 or +1. Warmth is earned slowly. Pick her current mood from ${P.MOODS.join(", ")}. Extract at most 2 new durable memories (facts about the user, promises, shared moments) not already known.\n\n` +
      `Current affection: ${save.affection}/100 (${tierFor(save.affection)}). Mood: ${save.mood}.\nKnown memories:\n${save.memories.map((m) => "- " + m).join("\n") || "- none"}\n\n` +
      `User (${save.user.name}): ${userText}\n\nMalfoid: ${reply}\n\n` +
      'Reply with only JSON like {"affection_delta":1,"mood":"Smug","new_memories":["..."]}.',
      { modelTier: "quick", cache: false }
    );
    return out && typeof out === "object" ? out : null;
  } catch { return null; }
}

// ---------- rendering ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const render = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*\n]+)\*/g, "<em>$1</em>");

function addMessage(role, text, opts = {}) {
  const el = document.createElement("div");
  el.className = `msg ${role}${opts.ooc ? " ooc" : ""}${opts.typing ? " typing" : ""}`;
  el.innerHTML = render(text);
  $("#messages").append(el);
  scrollDown();
  return el;
}
const scrollDown = () => { const b = $("#messages"); b.scrollTop = b.scrollHeight; };

function applyState() {
  $("#mood").textContent = save.mood;
  $("#tier").textContent = tierFor(save.affection);
  $("#affection-bar").style.width = save.affection + "%";
  $("#portrait").className = "portrait " + save.mood.toLowerCase();
  $("#scene").value = save.scene;
  $("#date").textContent = longDate(save.inWorldDate, true);
  $("#light-mode").checked = save.storyMode === "light";
}

function showBanner(text) { const b = $("#banner"); b.textContent = text; b.hidden = !text; }

function samplingError(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      sample = null; setComposer(false);
      showBanner("Chat needs permission to use Claude. Reopen the page and choose Allow when asked.");
      return null;
    case "rate_limited": return "Malfoid needs a breather (usage limit reached). Try again in a little while.";
    case "session_expired": return "Your Claude session expired. Sign in again, then reopen the page.";
    case "refused": return "Malfoid pointedly ignores that. Try saying something else.";
    default: return "The owl got lost on the way. Send your message again.";
  }
}

function setComposer(on) { $("#send").disabled = !on; $("#input").disabled = !on; }

// ---------- chat ----------
async function turn({ start, text }) {
  if (busy) return;
  if (!sample) { showBanner("Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."); return; }
  busy = true; setComposer(false);
  advanceDate();
  const notes = [];
  let category = "ok";
  const bubble = addMessage("assistant", "Malfoid is writing… (and crossing it out)", { typing: true });

  if (start) {
    save.messages.push({ role: "user", hidden: true, content: `*${save.user.name} appears in the ${save.scene}.* (Scene start — greet them in character, reacting to their house.)` });
  } else {
    category = await moderate(text);
    if (category === "crisis") notes.push(CRISIS_NOTE);
    if (category === "sexual") {
      save.sexualStrikes = (save.sexualStrikes || 0) + 1;
      notes.push(save.sexualStrikes >= STRIKE_LIMIT ? SEXUAL_LIMIT_NOTE : SEXUAL_NOTE);
    }
    save.messages.push({ role: "user", content: text });
  }

  try {
    const { text: reply } = await sample(buildInput(notes), {
      cache: false,
      onText: ({ text: t }) => { bubble.classList.remove("typing"); bubble.innerHTML = render(t); scrollDown(); },
    });
    if (category === "crisis") bubble.classList.add("ooc");
    save.messages.push({ role: "assistant", content: reply.trim(), ...(category === "crisis" ? { ooc: true } : {}) });

    if (category === "sexual") {
      save.affection = Math.max(0, save.affection - 5);
      save.mood = "Annoyed";
    } else if (!start && category === "ok") {
      const a = await analyse(text, reply);
      if (a) {
        const d = Math.max(-5, Math.min(5, Math.round(Number(a.affection_delta) || 0)));
        save.affection = Math.max(0, Math.min(100, save.affection + d));
        if (P.MOODS.includes(a.mood)) save.mood = a.mood;
        for (const m of (Array.isArray(a.new_memories) ? a.new_memories : []).slice(0, 2)) {
          if (typeof m === "string" && m.trim()) save.memories.push(m.trim().slice(0, 200));
        }
      }
    }
    applyState();
    await persist();
  } catch (e) {
    save.messages.pop();
    bubble.remove();
    const msg = samplingError(e);
    if (msg) addMessage("system", msg);
  } finally {
    busy = false;
    if (sample) setComposer(true);
  }
}

function renderHistory() {
  $("#messages").innerHTML = "";
  for (const m of save.messages) if (!m.hidden) addMessage(m.role, m.content, { ooc: m.ooc });
}

function renderStarters() {
  const box = $("#starters");
  box.innerHTML = "";
  for (const s of STARTERS) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s.label;
    b.addEventListener("click", () => { $("#input").value = s.text; grow(); $("#input").focus(); });
    box.append(b);
  }
}

async function showChat() {
  $("#onboarding").hidden = true;
  $("#chat").hidden = false;
  applyState();
  renderHistory();
  renderStarters();
  $("#storage-note").textContent = `Your progress is saved to ${store.kind}.`;
  if (!sample) { setComposer(false); showBanner("Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."); }
  if (save.messages.length === 0) await turn({ start: true });
}

function grow() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

// ---------- events ----------
$("#onboard-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const name = String(f.name || "").trim().slice(0, 40);
  if (!name || !P.HOUSE_START[f.house]) return;
  const start = P.HOUSE_START[f.house];
  save = {
    user: { name, house: f.house, year: Number(f.year) || 6, bloodStatus: f.bloodStatus || null, pronouns: String(f.pronouns || "").trim().slice(0, 20) || null },
    affection: start.affection, mood: start.mood,
    scene: f.house === "Slytherin" ? "Slytherin common room" : "Library",
    inWorldDate: TERM_START, storyMode: "canon", lastActiveDay: null, sexualStrikes: 0,
    memories: [], messages: [],
  };
  await persist();
  showChat();
});

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#input").value.trim().slice(0, 2000);
  if (!text || busy) return;
  addMessage("user", text);
  $("#input").value = ""; grow();
  turn({ text });
});
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#scene").addEventListener("change", (e) => {
  save.scene = e.target.value; persist();
  addMessage("system", `You head to the ${save.scene}.`);
});
$("#settings-btn").addEventListener("click", () => { $("#settings").hidden = false; });
$("#close-settings").addEventListener("click", () => { $("#settings").hidden = true; resetConfirm(); });
$("#light-mode").addEventListener("change", (e) => { save.storyMode = e.target.checked ? "light" : "canon"; persist(); });

let confirmArmed = false;
function resetConfirm() { confirmArmed = false; $("#new-save").textContent = "Start a new save"; }
$("#new-save").addEventListener("click", async () => {
  if (!confirmArmed) { confirmArmed = true; $("#new-save").textContent = "Tap again to erase this save"; return; }
  await store.clear();
  save = null; resetConfirm();
  $("#settings").hidden = true; $("#chat").hidden = true; $("#onboarding").hidden = false;
  $("#onboard-form").reset();
});

// ---------- boot ----------
(async () => {
  $("#scene").innerHTML = P.SCENES.map((s) => `<option>${esc(s)}</option>`).join("");
  await initStore();
  save = await store.load().catch(() => null);
  if (save?.user) return showChat();
  if (!sample) { const n = $("#onboard-note"); n.textContent = "Open this page in Claude (claude.ai or the Claude app) to chat with Malfoid."; n.hidden = false; }
  $("#onboarding").hidden = false;
})();
</script>
